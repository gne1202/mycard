<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>团结友善</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; padding: 30px; line-height: 1.8; color: #333; text-align: justify; }
        p { text-indent: 2em; margin-bottom: 15px; font-size: 16px; }
    </style>
</head>
<body>
    <p>“团结友善”是公民与公民之间应当如何相处的基本规范。每一个公民，不论民族、年龄、职业，都是中华人民共和国这个大家庭中的一员。</p>
    <p>公民之间应该彼此团结，相互友爱，建立起和睦友善的关系。团结就是力量，友善则是人际关系的润滑剂。在日常生活中，我们要学会尊重他人、关心他人、帮助他人，共同营造温馨和谐的社会氛围。</p>
</body>
</html>
