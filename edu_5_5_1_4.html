<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>勤俭自强</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; padding: 30px; line-height: 1.8; color: #333; text-align: justify; }
        p { text-indent: 2em; margin-bottom: 15px; font-size: 16px; }
    </style>
</head>
<body>
    <p>“勤俭自强”是公民对待生活、对待自身的道德规范。作为一个公民，必须要有勤劳勇敢、自强不息的精神。</p>
    <p>勤俭节约是中华民族的传统美德，反对铺张浪费是每个公民的责任。自强则意味着在面对困难和挫折时，不低头、不气馁，依靠自己的努力去拼搏进取，不断提升自我，为实现个人价值和国家繁荣贡献力量。</p>
</body>
</html>
