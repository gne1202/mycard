<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图书馆读者调查问卷</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .intro {
            background-color: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            line-height: 1.8;
            color: #555;
        }
        .question-box {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 15px;
        }
        .question-title {
            font-weight: bold;
            color: #333;
            font-size: 16px;
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin: 8px 0;
            cursor: pointer;
        }
        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 8px;
        }
        input[type="text"] {
            width: 95%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        textarea {
            width: 95%;
            height: 80px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }
        .submit-btn {
            display: block;
            width: 200px;
            margin: 20px auto;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .submit-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>图书馆读者调查问卷</h1>

    <div class="intro">
        为了能够及时了解您对图书馆的需求，提升我校图书馆文献资源建设的质量和水平，更好的为我校教学科研服务，我馆特设计了问卷调查题目如下，请协助填写，谢谢您的合作！
    </div>

    <form action="#" method="post">

        <!-- 1. 您的年级 -->
        <div class="question-box">
            <div class="question-title">1. 您的年级</div>
            <label><input type="radio" name="grade" value="大一"> 大一</label>
            <label><input type="radio" name="grade" value="大二"> 大二</label>
            <label><input type="radio" name="grade" value="大三"> 大三</label>
            <label><input type="radio" name="grade" value="大四"> 大四</label>
            <label><input type="radio" name="grade" value="研究生"> 研究生</label>
            <label><input type="radio" name="grade" value="其他"> 其他</label>
        </div>

        <!-- 2. 您的专业 -->
        <div class="question-box">
            <div class="question-title">2. 您的专业</div>
            <input type="text" name="major" placeholder="请输入您的专业">
        </div>

        <!-- 3. 对于图书馆的阅览环境 -->
        <div class="question-box">
            <div class="question-title">3. 对于图书馆的阅览环境</div>
            <label><input type="radio" name="environment" value="满意"> 满意</label>
            <label><input type="radio" name="environment" value="基本满意"> 基本满意</label>
            <label><input type="radio" name="environment" value="不满意"> 不满意</label>
            <br>
            <label>您的建议：</label>
            <textarea name="env_suggestion" placeholder="请输入您对阅览环境的建议..."></textarea>
        </div>

        <!-- 4. 您到图书馆的原因是（可多选） -->
        <div class="question-box">
            <div class="question-title">4. 您到图书馆的原因是（可多选）</div>
            <label><input type="checkbox" name="reason" value="借阅专业图书"> 借阅专业图书</label>
            <label><input type="checkbox" name="reason" value="随便坐坐，翻翻书刊"> 随便坐坐，翻翻书刊</label>
            <label><input type="checkbox" name="reason" value="借阅光盘"> 借阅光盘</label>
            <label><input type="checkbox" name="reason" value="参加图书馆组织的活动"> 参加图书馆组织的活动</label>
            <label><input type="checkbox" name="reason" value="自习，复习功课"> 自习，复习功课</label>
            <label><input type="checkbox" name="reason" value="上网"> 上网</label>
            <label><input type="checkbox" name="reason" value="检索电子文献"> 检索电子文献</label>
        </div>

        <!-- 5. 您到图书馆的频率 -->
        <div class="question-box">
            <div class="question-title">5. 您到图书馆的频率</div>
            <label><input type="radio" name="frequency" value="几乎每天"> 几乎每天</label>
            <label><input type="radio" name="frequency" value="每周1-2次"> 每周1-2次</label>
            <label><input type="radio" name="frequency" value="每月1-2次"> 每月1-2次</label>
            <label><input type="radio" name="frequency" value="几乎不去"> 几乎不去</label>
        </div>

        <!-- 6. 您对学校的建议 -->
        <div class="question-box">
            <div class="question-title">6. 您对学校的建议</div>
            <label>请您提出宝贵建议：</label>
            <textarea name="suggestion" placeholder="请输入您对学校的宝贵建议..."></textarea>
        </div>

        <button type="submit" class="submit-btn">提交问卷</button>

    </form>

</body>
</html>
