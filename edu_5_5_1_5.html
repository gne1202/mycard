<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>敬业奉献</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; padding: 30px; line-height: 1.8; color: #333; text-align: justify; }
        p { text-indent: 2em; margin-bottom: 15px; font-size: 16px; }
    </style>
</head>
<body>
    <p>“敬业奉献”是公民对待职业活动的道德规范。每一个公民都要从事一定的职业，职业是公民与社会联系的重要纽带。</p>
    <p>敬业要求公民热爱自己的本职工作，恪尽职守，精益求精。奉献则是一种高尚的境界，要求公民在职业活动中不计较个人得失，全心全意为人民服务，为社会进步贡献自己的力量。这是职业道德的核心体现。</p>
</body>
</html>
