<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>爱宠知识</title>
    <style>
        /* (1) 清空所有默认边距 */
        * {
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "Microsoft YaHei", sans-serif;
        }

        /* (1) 外面的盒子 370x550，居中，绿色背景，圆角 15px，半透明阴影 */
        .outer-box {
            width: 370px;
            height: 550px;
            background-color: #8bc34a; /* 绿色背景 */
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.4); /* 半透明阴影 */
            padding: 20px;
            box-sizing: border-box;
        }

        /* (2) 标题左侧竖线，颜色 #bbeb2c */
        .title {
            color: #fff;
            font-size: 22px;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 5px solid #bbeb2c;
            line-height: 1.2;
            letter-spacing: 1px;
        }

        /* (3) 里面的盒子 330x460，白色背景，半透明阴影 */
        .inner-box {
            width: 330px; /* 稍微减小宽度，适应外框的 padding */
            height: 455px; /* 调整高度以适应内容 */
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 5px 15px;
            box-sizing: border-box;
            
            /* 关键修复 2：隐藏超出的内容和滚动条 */
            overflow: hidden; 
        }

        ul {
            list-style: none; /* 清除默认圆点 */
        }

        /* (4) 列表行高 48px，下方虚线 #ccc */
        ul li {
            height: 48px;
            line-height: 48px;
            border-bottom: 1px dashed #ccc;
            
            /* 关键修复 1：使用 base64 格式的绿色小圆点作为图标 */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="%238bc34a" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8"/></svg>');
            background-repeat: no-repeat;
            background-position: left center; /* 图标垂直居中靠左 */
            
            /* 关键修复 1：增加左侧内边距，把文字推开，防止和图标重叠！ */
            padding-left: 25px; 
            
            /* 强制单行显示，超出部分隐藏，防止文字换行破坏布局 */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 去掉最后一行的下划线（可选，让视觉更干净） */
        ul li:last-child {
            border-bottom: none;
        }

        /* (5) 超链接样式 */
        ul li a {
            text-decoration: none;
            color: #333;
            font-size: 15px; /* 稍微调小一点点字体，防止太长溢出 */
            display: block;
            width: 100%;
            height: 100%;
            transition: all 0.2s;
        }

        /* 鼠标悬停：加粗，颜色 #739311，增加文字阴影 #bbeb2c */
        ul li a:hover {
            font-weight: bold;
            color: #739311;
            text-shadow: 1px 1px 2px #bbeb2c;
        }
    </style>
</head>
<body>

    <div class="outer-box">
        <h2 class="title">爱宠知识</h2>
        <div class="inner-box">
            <ul>
                <li><a href="#">养狗比养猫对健康更有利</a></li>
                <li><a href="#">日本正宗柴犬亮相，你怎么看柴犬？</a></li>
                <li><a href="#">狗狗歌曲《新年旺旺》</a></li>
                <li><a href="#">带宠兜风，开车带宠需要注意什么？</a></li>
                <li><a href="#">【爆笑】这狗狗太不给力了！</a></li>
                <li><a href="#">狗狗与男童相同着装拍有爱造型照</a></li>
                <li><a href="#">狗狗各个阶段健康大事件</a></li>
                <li><a href="#">调皮宠物狗陷在沙发里的搞笑瞬间</a></li>
                <li><a href="#">为什么每次大小便后，会用脚踢土？</a></li>
            </ul>
        </div>
    </div>

</body>
</html>
