<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>明礼诚信</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; padding: 30px; line-height: 1.8; color: #333; text-align: justify; }
        p { text-indent: 2em; margin-bottom: 15px; font-size: 16px; }
    </style>
</head>
<body>
    <p>“明礼诚信”是公民如何待人的道德规范。在我国，无论在何种场合，无论从事什么样的活动，公民彼此都应该讲文明、讲礼貌、讲诚实、讲信用。</p>
    <p>我国自古以礼仪之邦著称于世。在现代社会，明礼更是构建和谐社会的基础。诚信则是立身之本、交往之道，是市场经济良性运转的基石。公民应当做到言行一致，表里如一，重诺言，守信用。</p>
</body>
</html>
