<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>简易灯箱画廊</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; background-color: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .gallery-container { width: 960px; background-color: #3ebc84; padding: 30px 0; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); overflow: hidden; }
        .header h2 { color: white; font-size: 24px; margin-bottom: 15px; letter-spacing: 2px; }
        .divider { height: 3px; background-color: #d32f2f; width: 100%; margin-bottom: 30px; }
        
        .viewport { width: 850px; margin: 0 auto; overflow: hidden; position: relative; }
        .scroll-list { display: flex; width: max-content; }
        
        .item { display: flex; flex-direction: column; align-items: center; margin: 0 15px; cursor: pointer; width: 100px; }
        .item span { color: #1565c0; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .item img { width: 100px; height: 70px; object-fit: cover; border-bottom: 4px solid transparent; transition: all 0.3s; }
        .item.active img, .item:hover img { border-bottom: 4px solid #d32f2f; }
        
        .main-display { margin-top: 30px; height: 420px; display: flex; justify-content: center; align-items: center; }
        .main-display img { max-width: 85%; max-height: 100%; border: 5px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.3); object-fit: contain; }
    </style>
</head>
<body>

    <div class="gallery-container">
        <div class="header"><h2>简易灯箱画廊设计</h2></div>
        <div class="divider"></div>

        <div class="viewport" id="viewport">
            <div class="scroll-list" id="scrollList">
                <!-- 注意：这里去掉了 images/ 前缀，图片直接和 html 放一起即可 -->
                <div class="item" onclick="changeImage(this, 't1.jpg')"><span>T1</span><img src="t1.jpg" alt="T1"></div>
                <div class="item" onclick="changeImage(this, 't2.jpg')"><span>T2</span><img src="t2.jpg" alt="T2"></div>
                <div class="item active" onclick="changeImage(this, 't3.jpg')"><span>T3</span><img src="t3.jpg" alt="T3"></div>
                <div class="item" onclick="changeImage(this, 't4.jpg')"><span>T4</span><img src="t4.jpg" alt="T4"></div>
                <div class="item" onclick="changeImage(this, 't5.jpg')"><span>T5</span><img src="t5.jpg" alt="T5"></div>
                <div class="item" onclick="changeImage(this, 't6.jpg')"><span>T6</span><img src="t6.jpg" alt="T6"></div>
                <div class="item" onclick="changeImage(this, 't7.jpg')"><span>T7</span><img src="t7.jpg" alt="T7"></div>
            </div>
        </div>

        <div class="main-display">
            <img id="bigImage" src="t3.jpg" alt="Big View">
        </div>
    </div>

    <script>
        const scrollList = document.getElementById('scrollList');
        const viewport = document.getElementById('viewport');
        const originalContent = scrollList.innerHTML;
        scrollList.innerHTML += originalContent; // 复制一份实现无缝
        
        let currentPos = 0;
        const speed = 1; 
        let isPaused = false;
        const singleGroupWidth = 910; // 130px * 7张

        function startScroll() {
            if (!isPaused) {
                currentPos -= speed;
                if (Math.abs(currentPos) >= singleGroupWidth) currentPos = 0;
                scrollList.style.transform = `translateX(${currentPos}px)`;
            }
            requestAnimationFrame(startScroll);
        }
        requestAnimationFrame(startScroll);

        viewport.addEventListener('mouseenter', () => isPaused = true);
        viewport.addEventListener('mouseleave', () => isPaused = false);

        function changeImage(element, bigImgSrc) {
            document.getElementById('bigImage').src = bigImgSrc;
            document.querySelectorAll('.item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
